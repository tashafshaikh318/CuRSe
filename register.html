<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | CuRSe</title><link rel="stylesheet" href="css/style.css"></head><body><div class="auth"><div class="auth-box wide"><a class="brand" href="index.html"><span class="logo">C</span> CuRSe</a><h1>Create your profile</h1><p>Tell CuRSe about your academic background.</p><form id="registerForm" class="form-grid"><label>Full Name<input required></label><label>Email<input type="email" required></label><label>Student ID<input required></label><label>Mobile<input pattern="[0-9]{10}" required></label><label>Branch<input placeholder="Computer Engineering" required></label><label>Year<select><option>3rd Year</option><option>2nd Year</option><option>4th Year</option></select></label><label>Password<input type="password" minlength="6" required></label><label>Confirm Password<input type="password" minlength="6" required></label><button class="btn full">Create Account</button></form><p class="center">Already registered? <a href="login.html">Login</a></p></div></div><script src="js/app.js"></script></body></html>
